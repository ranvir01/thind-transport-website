# Drain fallback — fast-forwards main from the integrator branch when both
# agent platforms are down (docs/agent-improvement-loop.md §5, postmortem in
# commit 0f9003b: main sat hours behind a green integrator because the :59
# Cursor deploy agent was the only drain path).
#
# Safety properties:
#   - only fires when the integrator is MORE than 3 commits ahead of main,
#     so the normal :59 drain always gets first shot;
#   - only pushes when main is a strict ancestor of the integrator head
#     (a plain, non-force push — git itself rejects anything but a
#     fast-forward);
#   - only pushes after `npm run build` and `npx vitest run` pass on the
#     exact integrator commit being promoted.
name: drain-fallback

on:
  schedule:
    - cron: "15 * * * *" # :15, offset from integrator (:00), smoke (:30), deploy (:59)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drain-fallback
  cancel-in-progress: false

env:
  INTEGRATOR_BRANCH: claude/hauldesk-project-setup-l1luoo
  AHEAD_THRESHOLD: 3

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a fallback drain is needed
        id: gate
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATOR_BRANCH"
          INTEGRATOR_SHA=$(git rev-parse "origin/$INTEGRATOR_BRANCH")
          AHEAD=$(git rev-list --count origin/main.."origin/$INTEGRATOR_BRANCH")
          BEHIND=$(git rev-list --count "origin/$INTEGRATOR_BRANCH"..origin/main)
          echo "integrator=$INTEGRATOR_SHA ahead=$AHEAD behind=$BEHIND"
          if [ "$BEHIND" -ne 0 ]; then
            echo "Integrator is behind main — not fast-forwardable; the integrator must merge main first. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$AHEAD" -le "$AHEAD_THRESHOLD" ]; then
            echo "Only $AHEAD commit(s) ahead (threshold $AHEAD_THRESHOLD) — leaving the drain to the normal :59 deploy agent."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=$INTEGRATOR_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        # --ignore-scripts skips the canvas source build (only needed by
        # offline PDF utility scripts, not the app); bcrypt and sharp are the
        # native modules the app actually loads, so rebuild just those.
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.gate.outputs.sha }}"
          npm ci --ignore-scripts
          npm rebuild bcrypt sharp

      - name: Verify integrator head (build + tests)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run build
          npx vitest run

      - name: Fast-forward main
        if: steps.gate.outputs.run == 'true'
        # Plain push — git rejects it unless it is a true fast-forward, so a
        # concurrent drain or new main commit makes this fail safely.
        run: git push origin "${{ steps.gate.outputs.sha }}:refs/heads/main"
