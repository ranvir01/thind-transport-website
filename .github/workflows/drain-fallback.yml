# Drain fallback — lands the integrator branch on main when both agent
# platforms are down (docs/agent-improvement-loop.md §5, postmortem in
# commit 0f9003b: main sat hours behind a green integrator because the :59
# Cursor deploy agent was the only drain path).
#
# Safety properties:
#   - only fires when the integrator is MORE than 3 commits ahead of main,
#     so the normal :59 drain always gets first shot;
#   - only merges when main is a strict ancestor of the integrator head
#     (linear history only — a diverged main is left for the agents);
#   - only pushes after `npm run build` and `npx vitest run` pass on the
#     exact integrator commit being promoted.
#
# Learned 2026-07-19 (QA rig drive on main@5218a91): this used to be a plain
# fast-forward push. That lands the exact SHA Vercel already built as an
# integrator-branch preview, and Vercel dedupes deployments by SHA — the
# production alias can sit stale with no new build ever queued.
#
# Learned again 2026-07-19 (QA rig drive on main@11c9be2): a --no-ff merge is
# NOT enough. The merge commit's TREE is byte-identical to the integrator tip
# Vercel already built, and Vercel's dedupe keys on content, not just the
# commit SHA — the first --no-ff drain (11c9be2) produced no deployment at
# all. The drain commit must therefore also change the tree: it writes the
# drained SHA + timestamp into `.drain-stamp` inside the merge commit, so
# every drain has a tree Vercel has never built.
name: drain-fallback

on:
  schedule:
    - cron: "15 * * * *" # :15, offset from integrator (:00), smoke (:30), deploy (:59)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drain-fallback
  cancel-in-progress: false

env:
  INTEGRATOR_BRANCH: claude/hauldesk-project-setup-l1luoo
  AHEAD_THRESHOLD: 3

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a fallback drain is needed
        id: gate
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATOR_BRANCH"
          INTEGRATOR_SHA=$(git rev-parse "origin/$INTEGRATOR_BRANCH")
          AHEAD=$(git rev-list --count origin/main.."origin/$INTEGRATOR_BRANCH")
          BEHIND=$(git rev-list --count "origin/$INTEGRATOR_BRANCH"..origin/main)
          echo "integrator=$INTEGRATOR_SHA ahead=$AHEAD behind=$BEHIND"
          if [ "$BEHIND" -ne 0 ]; then
            echo "Integrator is behind main — not fast-forwardable; the integrator must merge main first. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$AHEAD" -le "$AHEAD_THRESHOLD" ]; then
            echo "Only $AHEAD commit(s) ahead (threshold $AHEAD_THRESHOLD) — leaving the drain to the normal :59 deploy agent."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=$INTEGRATOR_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        # --ignore-scripts skips the canvas source build (only needed by
        # offline PDF utility scripts, not the app); bcrypt and sharp are the
        # native modules the app actually loads, so rebuild just those.
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.gate.outputs.sha }}"
          npm ci --ignore-scripts
          npm rebuild bcrypt sharp

      - name: Verify integrator head (build + tests)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          npm run build
          npx vitest run
          # Type-soundness + license hygiene, both enforceable today:
          # app code must have zero tsc errors, test-file debt may only
          # shrink, and no GPL/AGPL/SSPL may reach production deps.
          node scripts/typecheck-gate.mjs
          node scripts/license-audit.mjs

      - name: Merge integrator into main (new commit + stamped tree — defeats Vercel dedupe)
        if: steps.gate.outputs.run == 'true'
        # `git push` (not a raw ref push) refuses to move main unless the
        # local branch is a fast-forward of the remote, so a concurrent drain
        # or new main commit makes this fail safely. The .drain-stamp write
        # gives the merge commit a tree Vercel has never built (content-level
        # dedupe otherwise skips the build entirely).
        run: |
          set -euo pipefail
          SHA="${{ steps.gate.outputs.sha }}"
          git checkout -B main origin/main
          git -c user.name="loadoff-drain-bot" -c user.email="noreply@anthropic.com" \
            merge --no-ff --no-commit "$SHA"
          printf 'sha=%s\ndrained_at=%s\nrun=%s\n' \
            "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID:-manual}" > .drain-stamp
          git add .drain-stamp
          git -c user.name="loadoff-drain-bot" -c user.email="noreply@anthropic.com" \
            commit -m "Drain integrator to main ($SHA)"
          git push origin main
