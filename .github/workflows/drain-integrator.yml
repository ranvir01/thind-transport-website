# Drain fallback (learned 2026-07-10): the integrator→main drain must not depend
# on any single agent platform being alive. Cursor's cloud VMs went read-only,
# the :59 deploy agent silently stopped merging, and the production alias sat
# hours behind a green integrator. This Action is the platform-independent
# backstop: when the integrator is more than AGENT_CATCHUP_THRESHOLD commits
# ahead of main AND build+tests are green on the integrator SHA, fast-forward
# main. It never merges — a diverged history is left for the agents, so this
# workflow can only publish history that already exists on the integrator.
#
# Scheduled at :17/:47 to stay clear of the fleet crons (:00 integrator,
# :30 prod smoke, :59 deploy). See docs/agent-improvement-loop.md §3a/§5.

name: Drain integrator to main

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drain-integrator
  cancel-in-progress: false

env:
  INTEGRATOR: claude/hauldesk-project-setup-l1luoo
  AGENT_CATCHUP_THRESHOLD: "3"

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check drift (catch-up mode only)
        id: drift
        run: |
          git fetch origin main "$INTEGRATOR"
          AHEAD=$(git rev-list --count origin/main..origin/"$INTEGRATOR")
          echo "Integrator ahead of main: $AHEAD (threshold: $AGENT_CATCHUP_THRESHOLD)"
          if [ "$AHEAD" -le "$AGENT_CATCHUP_THRESHOLD" ]; then
            echo "Steady state — the :59 deploy agent owns the drain. Nothing to do."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/"$INTEGRATOR"; then
            echo "::warning::Integrator and main have diverged — fast-forward impossible."
            echo "Leaving the merge to the deploy agent / a human; this job only fast-forwards."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drain=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.drift.outputs.drain == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Verify integrator (build + tests)
        if: steps.drift.outputs.drain == 'true'
        run: |
          git checkout origin/"$INTEGRATOR"
          # --ignore-scripts: `canvas` needs system libs to compile and nothing
          # in src/ imports it; Next.js and the test suite don't need postinstall.
          npm ci --ignore-scripts
          npm run build
          npx vitest run

      - name: Fast-forward main
        if: steps.drift.outputs.drain == 'true'
        run: |
          SHA=$(git rev-parse origin/"$INTEGRATOR")
          echo "Fast-forwarding main to $SHA"
          # A plain push refuses non-fast-forward, so a race with the :59 agent
          # fails safely instead of rewriting main.
          git push origin "$SHA":refs/heads/main
