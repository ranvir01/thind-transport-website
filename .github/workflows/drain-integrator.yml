# Drain fallback: fast-forward main to the integrator branch when the hourly
# agents (Cursor deploy @ :59, Claude routines) are all down. This is the
# platform-independent leg of the drain-redundancy rule in
# docs/agent-improvement-loop.md §3a — it only acts in catch-up mode
# (integrator > threshold commits ahead), only fast-forwards (a diverged
# integrator still needs an agent to merge), and only after build + tests
# pass on the exact commit it is about to promote.
name: drain-integrator

on:
  schedule:
    - cron: "15 * * * *" # staggered against Cursor agents at :00 / :30 / :59
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: drain-integrator
  cancel-in-progress: false

env:
  INTEGRATOR: claude/hauldesk-project-setup-l1luoo
  AGENT_CATCHUP_THRESHOLD: "3" # keep in lockstep with scripts/agent-loop-status.mjs

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a drain is needed
        id: check
        run: |
          git fetch origin main "$INTEGRATOR"
          AHEAD=$(git rev-list --count "origin/main..origin/$INTEGRATOR")
          echo "integrator is $AHEAD commit(s) ahead of main (threshold $AGENT_CATCHUP_THRESHOLD)"
          if [ "$AHEAD" -le "$AGENT_CATCHUP_THRESHOLD" ]; then
            echo "steady state — the hourly agents own the drain; nothing to do"
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "origin/$INTEGRATOR"; then
            echo "::warning::integrator is $AHEAD ahead but has diverged from main — fast-forward impossible, an agent must merge (docs/agent-improvement-loop.md §3a)"
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drain=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.drain == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Verify the integrator tip (build + tests)
        if: steps.check.outputs.drain == 'true'
        run: |
          git checkout --detach "origin/$INTEGRATOR"
          bash scripts/setup-canvas-deps.sh
          npm ci
          npm run build
          npx vitest run

      - name: Fast-forward main
        if: steps.check.outputs.drain == 'true'
        run: |
          git push origin "origin/$INTEGRATOR:refs/heads/main"
          echo "fast-forwarded main to $(git rev-parse --short "origin/$INTEGRATOR") — Vercel deploys from here"
