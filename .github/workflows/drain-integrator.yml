# Drain fallback (learned 2026-07-10): the integrator→main drain must not depend
# on any single agent platform being alive. Cursor's cloud VMs went read-only,
# the :59 deploy agent silently stopped merging, and the production alias sat
# hours behind a green integrator. This Action is the platform-independent
# backstop: when the integrator is more than AGENT_CATCHUP_THRESHOLD commits
# ahead of main AND build+tests are green on the integrator SHA, land it on
# main. It never merges conflicting history — a diverged main is left for the
# agents, so this workflow only ever publishes history that already exists on
# the integrator (via a --no-ff merge commit, never a rebase or squash).
#
# Learned 2026-07-19 (QA rig drive on main@5218a91): a plain fast-forward push
# lands the exact commit SHA Vercel already built as an integrator-branch
# preview. Vercel dedupes deployments by SHA, so the production alias can sit
# on stale content with no new build ever queued. The fix is to always create
# a brand-new merge commit — a SHA Vercel has never seen — so production
# always gets a real build.
#
# Scheduled at :17/:47 to stay clear of the fleet crons (:00 integrator,
# :30 prod smoke, :59 deploy). See docs/agent-improvement-loop.md §3a/§5.

name: Drain integrator to main

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drain-integrator
  cancel-in-progress: false

env:
  INTEGRATOR: claude/hauldesk-project-setup-l1luoo
  AGENT_CATCHUP_THRESHOLD: "3"

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check drift (catch-up mode only)
        id: drift
        run: |
          git fetch origin main "$INTEGRATOR"
          AHEAD=$(git rev-list --count origin/main..origin/"$INTEGRATOR")
          echo "Integrator ahead of main: $AHEAD (threshold: $AGENT_CATCHUP_THRESHOLD)"
          if [ "$AHEAD" -le "$AGENT_CATCHUP_THRESHOLD" ]; then
            echo "Steady state — the :59 deploy agent owns the drain. Nothing to do."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/"$INTEGRATOR"; then
            echo "::warning::Integrator and main have diverged — cannot drain safely."
            echo "Leaving the merge to the deploy agent / a human; this job only drains linear history."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drain=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.drift.outputs.drain == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Verify integrator (build + tests)
        if: steps.drift.outputs.drain == 'true'
        run: |
          git checkout origin/"$INTEGRATOR"
          # --ignore-scripts: `canvas` needs system libs to compile and nothing
          # in src/ imports it; Next.js and the test suite don't need postinstall.
          npm ci --ignore-scripts
          npm run build
          npx vitest run

      - name: Merge integrator into main (new commit — avoids Vercel SHA dedupe)
        if: steps.drift.outputs.drain == 'true'
        run: |
          set -euo pipefail
          SHA=$(git rev-parse origin/"$INTEGRATOR")
          echo "Draining $SHA into main via --no-ff merge"
          git checkout -B main origin/main
          git -c user.name="loadoff-drain-bot" -c user.email="noreply@anthropic.com" \
            merge --no-ff "$SHA" -m "Drain integrator to main ($SHA)"
          # git push (not a raw ref push) refuses non-fast-forward on the local
          # side, so a race with another drain fails safely instead of
          # rewriting main.
          git push origin main
