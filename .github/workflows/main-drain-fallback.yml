# Fallback drain for the Cursor deploy agent (.cursor/automation/loadoff-deploy.prompt.md).
#
# Normally the :59 UTC deploy automation drains the integrator branch into main. On
# 2026-07-10 that platform's cloud VMs went read-only and main sat hours behind a green
# integrator (commit 0f9003b has the post-mortem). This job is the platform-independent
# backstop: when the integrator is a clean fast-forward of main, more than
# AGENT_CATCHUP_THRESHOLD commits ahead, and build + tests pass on that exact sha, it
# fast-forwards main. It never merges, never resolves conflicts, and never launches
# agents (the .cursor/automation/README.md ban covers Actions that LAUNCH agents on
# paid APIs — this is plain CI + a fast-forward push).
#
# Runs at :20, between the integrator (:00) and the deploy agent (:59), so the normal
# drain still wins whenever it is healthy: within an hour of integrator work landing,
# main is either already drained or this job drains it.

name: Main drain fallback

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-drain-fallback
  cancel-in-progress: false

env:
  INTEGRATOR_BRANCH: claude/hauldesk-project-setup-l1luoo
  AGENT_CATCHUP_THRESHOLD: "3"

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a drain is needed
        id: gate
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATOR_BRANCH"
          MAIN=$(git rev-parse "origin/main")
          INTEGRATOR=$(git rev-parse "origin/$INTEGRATOR_BRANCH")
          if [ "$MAIN" = "$INTEGRATOR" ]; then
            echo "main is already at the integrator sha — nothing to drain."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$MAIN" "$INTEGRATOR"; then
            echo "main is not an ancestor of $INTEGRATOR_BRANCH — a fast-forward is impossible."
            echo "The deploy agent owns divergent merges; doing nothing."
            echo "drain=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AHEAD=$(git rev-list --count "$MAIN..$INTEGRATOR")
          echo "integrator is $AHEAD commit(s) ahead of main (threshold $AGENT_CATCHUP_THRESHOLD)."
          if [ "$AHEAD" -gt "$AGENT_CATCHUP_THRESHOLD" ]; then
            echo "drain=true" >> "$GITHUB_OUTPUT"
            echo "sha=$INTEGRATOR" >> "$GITHUB_OUTPUT"
          else
            echo "Within threshold — the hourly deploy agent will handle it."
            echo "drain=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.drain == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Verify the integrator sha (build + tests)
        if: steps.gate.outputs.drain == 'true'
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.gate.outputs.sha }}"
          npm ci
          npm run build
          npx vitest run
          # Type-soundness + license hygiene, both enforceable today:
          # app code must have zero tsc errors, test-file debt may only
          # shrink, and no GPL/AGPL/SSPL may reach production deps.
          node scripts/typecheck-gate.mjs
          node scripts/license-audit.mjs

      - name: Fast-forward main
        if: steps.gate.outputs.drain == 'true'
        run: |
          set -euo pipefail
          git push origin "${{ steps.gate.outputs.sha }}:refs/heads/main"
          echo "main fast-forwarded to ${{ steps.gate.outputs.sha }}"
