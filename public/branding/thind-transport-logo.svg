<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="truckGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#E68600"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#002B5C"/>
      <stop offset="100%" stop-color="#001F3F"/>
    </linearGradient>
  </defs>
  
  <!-- Shield / Road emblem -->
  <g transform="translate(10, 8)">
    <!-- Shield shape -->
    <path d="M50 2 L95 18 L95 58 Q95 90 50 108 Q5 90 5 58 L5 18 Z" fill="url(#navyGrad)" stroke="#FF9500" stroke-width="2.5"/>
    
    <!-- Road / highway lines inside shield -->
    <path d="M50 95 L38 45 L30 25 M50 95 L62 45 L70 25" stroke="#FF9500" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="50" y2="50" stroke="#FF9500" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Truck silhouette -->
    <g transform="translate(28, 52)">
      <!-- Trailer -->
      <rect x="0" y="4" width="28" height="16" rx="1" fill="#FF9500"/>
      <!-- Cab -->
      <path d="M28 6 L40 6 Q44 6 44 10 L44 20 L28 20 Z" fill="#FF9500"/>
      <!-- Windshield -->
      <path d="M32 8 L38 8 Q40 8 40 10 L40 14 L32 14 Z" fill="#001F3F"/>
      <!-- Wheels -->
      <circle cx="8" cy="22" r="3.5" fill="#001F3F" stroke="#FF9500" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#001F3F" stroke="#FF9500" stroke-width="1"/>
      <circle cx="38" cy="22" r="3.5" fill="#001F3F" stroke="#FF9500" stroke-width="1"/>
      <!-- Wheel centers -->
      <circle cx="8" cy="22" r="1" fill="#FF9500"/>
      <circle cx="20" cy="22" r="1" fill="#FF9500"/>
      <circle cx="38" cy="22" r="1" fill="#FF9500"/>
    </g>
  </g>
  
  <!-- Company Name -->
  <text x="120" y="55" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#001F3F">THIND</text>
  <text x="120" y="92" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="6" fill="#001F3F">TRANSPORT</text>
  
  <!-- Accent line -->
  <rect x="120" y="58" width="180" height="3" rx="1.5" fill="url(#truckGrad)"/>
  
  <!-- Tagline -->
  <text x="120" y="110" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#4A4A4A">FLATBED  |  REEFER  |  DRY VAN</text>
</svg>
