<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1039 696" fill="none">
  <!-- 
    MOO Business Card Back - Thind Transport  
    Features: Long-haul truck illustration with load route chain,
    company branding, tagline
  -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="40%" stop-color="#002B5C"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="roadSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="orangeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FFB340"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#E68600"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1039" height="696" fill="url(#skyGrad)"/>
  
  <!-- Horizon glow -->
  <ellipse cx="520" cy="420" rx="600" ry="200" fill="url(#horizonGlow)"/>

  <!-- Stars (subtle) -->
  <circle cx="120" cy="60" r="1" fill="white" opacity="0.4"/>
  <circle cx="250" cy="90" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="380" cy="45" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="500" cy="80" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="650" cy="55" r="1" fill="white" opacity="0.4"/>
  <circle cx="780" cy="75" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="900" cy="50" r="1.1" fill="white" opacity="0.45"/>
  <circle cx="180" cy="120" r="0.6" fill="white" opacity="0.25"/>
  <circle cx="720" cy="100" r="0.9" fill="white" opacity="0.35"/>

  <!-- Road / Highway -->
  <path d="M0 520 Q200 480 520 460 Q840 440 1039 420 L1039 696 L0 696 Z" fill="url(#roadSurface)"/>
  
  <!-- Road edge lines -->
  <path d="M0 518 Q200 478 520 458 Q840 438 1039 418" stroke="#FF9500" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M0 696 L1039 696" stroke="#FF9500" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Center road dashes -->
  <path d="M0 570 Q200 540 520 525 Q840 510 1039 495" stroke="#FFB340" stroke-width="2" stroke-dasharray="30,20" fill="none" opacity="0.5"/>

  <!-- === LONG-HAUL TRUCK ILLUSTRATION (center) === -->
  <g transform="translate(240, 330)">
    <!-- Trailer shadow -->
    <ellipse cx="280" cy="165" rx="260" ry="12" fill="rgba(0,0,0,0.3)"/>
    
    <!-- === LOAD ROUTE CHAIN - Connected to back of trailer === -->
    <!-- Chain links going backward from trailer -->
    <g opacity="0.6">
      <!-- Connection nodes (pipeline chain) -->
      <circle cx="-30" cy="90" r="8" fill="none" stroke="#FF9500" stroke-width="2"/>
      <circle cx="-30" cy="90" r="3" fill="#FF9500"/>
      <line x1="-22" y1="90" x2="5" y2="90" stroke="#FF9500" stroke-width="2"/>
      
      <circle cx="-80" cy="90" r="8" fill="none" stroke="#FFB340" stroke-width="2"/>
      <circle cx="-80" cy="90" r="3" fill="#FFB340"/>
      <line x1="-72" y1="90" x2="-38" y2="90" stroke="#FFB340" stroke-width="2"/>
      
      <circle cx="-130" cy="90" r="8" fill="none" stroke="#FF9500" stroke-width="2"/>
      <circle cx="-130" cy="90" r="3" fill="#FF9500"/>
      <line x1="-122" y1="90" x2="-88" y2="90" stroke="#FF9500" stroke-width="2"/>
      
      <!-- Labels on chain nodes -->
      <text x="-130" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FF9500" text-anchor="middle">PICKUP</text>
      <text x="-80" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FFB340" text-anchor="middle">HAUL</text>
      <text x="-30" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FF9500" text-anchor="middle">LOAD</text>
    </g>
    
    <!-- Trailer body -->
    <rect x="5" y="50" width="320" height="100" rx="4" fill="url(#truckBody)"/>
    <rect x="5" y="50" width="320" height="100" rx="4" fill="none" stroke="#E68600" stroke-width="1.5"/>
    
    <!-- Trailer side details (ridges) -->
    <line x1="40" y1="55" x2="40" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="55" x2="80" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="55" x2="120" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="55" x2="160" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="55" x2="200" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="240" y1="55" x2="240" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="55" x2="280" y2="145" stroke="#E68600" stroke-width="1" opacity="0.5"/>
    
    <!-- "THIND TRANSPORT" on trailer side -->
    <text x="165" y="95" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#001F3F" text-anchor="middle" letter-spacing="1">THIND</text>
    <text x="165" y="118" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#001F3F" text-anchor="middle" letter-spacing="4">TRANSPORT</text>
    
    <!-- Cab body -->
    <path d="M325 55 L380 55 Q420 55 430 70 L445 100 Q450 110 450 120 L450 148 Q450 152 446 152 L325 152 L325 55 Z" fill="url(#truckBody)"/>
    <path d="M325 55 L380 55 Q420 55 430 70 L445 100 Q450 110 450 120 L450 148 Q450 152 446 152 L325 152 L325 55 Z" fill="none" stroke="#E68600" stroke-width="1.5"/>
    
    <!-- Windshield -->
    <path d="M355 60 L395 60 Q415 60 425 75 L438 102 L438 115 Q438 118 435 118 L355 118 L355 60 Z" fill="#001F3F" opacity="0.7"/>
    <path d="M355 60 L395 60 Q415 60 425 75 L438 102" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
    
    <!-- Headlights -->
    <rect x="445" y="105" width="8" height="14" rx="2" fill="#FFE5BF" opacity="0.9"/>
    <rect x="445" y="125" width="8" height="8" rx="2" fill="#FF4444" opacity="0.7"/>
    
    <!-- Bumper -->
    <rect x="448" y="140" width="10" height="14" rx="2" fill="#888"/>
    
    <!-- Exhaust stacks -->
    <rect x="340" y="25" width="5" height="30" rx="2" fill="#888"/>
    <rect x="350" y="28" width="5" height="27" rx="2" fill="#888"/>
    
    <!-- Wheels - trailer -->
    <circle cx="60" cy="158" r="16" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
    <circle cx="60" cy="158" r="8" fill="#333"/>
    <circle cx="60" cy="158" r="3" fill="#888"/>
    
    <circle cx="100" cy="158" r="16" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
    <circle cx="100" cy="158" r="8" fill="#333"/>
    <circle cx="100" cy="158" r="3" fill="#888"/>
    
    <circle cx="270" cy="158" r="16" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
    <circle cx="270" cy="158" r="8" fill="#333"/>
    <circle cx="270" cy="158" r="3" fill="#888"/>
    
    <circle cx="310" cy="158" r="16" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
    <circle cx="310" cy="158" r="8" fill="#333"/>
    <circle cx="310" cy="158" r="3" fill="#888"/>
    
    <!-- Wheels - cab -->
    <circle cx="410" cy="158" r="18" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
    <circle cx="410" cy="158" r="9" fill="#333"/>
    <circle cx="410" cy="158" r="3.5" fill="#888"/>
    
    <!-- === ROUTE CHAIN - Connected to front of cab === -->
    <g opacity="0.6">
      <line x1="458" y1="90" x2="490" y2="90" stroke="#FF9500" stroke-width="2"/>
      <circle cx="505" cy="90" r="8" fill="none" stroke="#FF9500" stroke-width="2"/>
      <circle cx="505" cy="90" r="3" fill="#FF9500"/>
      
      <line x1="513" y1="90" x2="540" y2="90" stroke="#FFB340" stroke-width="2"/>
      <circle cx="555" cy="90" r="8" fill="none" stroke="#FFB340" stroke-width="2"/>
      <circle cx="555" cy="90" r="3" fill="#FFB340"/>
      
      <line x1="563" y1="90" x2="590" y2="90" stroke="#FF9500" stroke-width="2"/>
      <circle cx="605" cy="90" r="8" fill="none" stroke="#FF9500" stroke-width="2"/>
      <circle cx="605" cy="90" r="3" fill="#FF9500"/>
      
      <!-- Labels on front chain nodes -->
      <text x="505" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FF9500" text-anchor="middle">ROUTE</text>
      <text x="555" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FFB340" text-anchor="middle">DELIVER</text>
      <text x="605" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="700" fill="#FF9500" text-anchor="middle">SETTLE</text>
    </g>
  </g>

  <!-- Company Name - Top -->
  <text x="520" y="85" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">THIND TRANSPORT</text>
  
  <!-- Accent bar under name -->
  <rect x="340" y="100" width="360" height="4" rx="2" fill="url(#orangeLine)"/>
  
  <!-- Tagline -->
  <text x="520" y="130" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="4">YOUR FREIGHT, OUR COMMITMENT</text>

  <!-- Service badges along bottom -->
  <g transform="translate(175, 618)">
    <!-- Flatbed badge -->
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(255,149,0,0.15)" stroke="#FF9500" stroke-width="1"/>
    <text x="60" y="21" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" fill="#FF9500" text-anchor="middle" letter-spacing="1">FLATBED</text>
    
    <!-- Reefer badge -->
    <rect x="140" y="0" width="120" height="32" rx="16" fill="rgba(255,149,0,0.15)" stroke="#FF9500" stroke-width="1"/>
    <text x="200" y="21" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" fill="#FF9500" text-anchor="middle" letter-spacing="1">REEFER</text>
    
    <!-- Dry Van badge -->
    <rect x="280" y="0" width="120" height="32" rx="16" fill="rgba(255,149,0,0.15)" stroke="#FF9500" stroke-width="1"/>
    <text x="340" y="21" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" fill="#FF9500" text-anchor="middle" letter-spacing="1">DRY VAN</text>

    <!-- 48 States badge -->
    <rect x="420" y="0" width="120" height="32" rx="16" fill="rgba(255,149,0,0.15)" stroke="#FF9500" stroke-width="1"/>
    <text x="480" y="21" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" fill="#FF9500" text-anchor="middle" letter-spacing="1">48 STATES</text>
  </g>

  <!-- Website at bottom center -->
  <text x="520" y="680" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">THINDTRANSPORT.COM</text>
</svg>
