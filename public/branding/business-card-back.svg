<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1039 696" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="45%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="truckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#E07800"/>
    </linearGradient>
    <linearGradient id="cabG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA520"/>
      <stop offset="100%" stop-color="#E68600"/>
    </linearGradient>
    <linearGradient id="trailG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF9500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="trailLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FF9500" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="headlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFEEBB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFEEBB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1039" height="696" fill="url(#sky)"/>

  <!-- Atmospheric haze -->
  <ellipse cx="520" cy="440" rx="700" ry="80" fill="#2a4a6a" opacity="0.15"/>
  <ellipse cx="520" cy="420" rx="500" ry="50" fill="#FF9500" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1" fill="white" opacity="0.6"/>
  <circle cx="160" cy="85" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="230" cy="25" r="1" fill="white" opacity="0.5"/>
  <circle cx="350" cy="60" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="460" cy="30" r="1.2" fill="white" opacity="0.65"/>
  <circle cx="560" cy="75" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="640" cy="20" r="1" fill="white" opacity="0.5"/>
  <circle cx="740" cy="55" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="830" cy="35" r="1.1" fill="white" opacity="0.55"/>
  <circle cx="920" cy="70" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="960" cy="30" r="0.9" fill="white" opacity="0.45"/>
  <circle cx="290" cy="100" r="0.5" fill="white" opacity="0.2"/>
  <circle cx="700" cy="95" r="0.6" fill="white" opacity="0.25"/>
  <circle cx="520" cy="45" r="0.8" fill="white" opacity="0.35"/>

  <!-- Road surface -->
  <path d="M0 480 Q260 445 520 435 Q780 425 1039 410 L1039 696 L0 696Z" fill="url(#road)"/>
  <path d="M0 478 Q260 443 520 433 Q780 423 1039 408" stroke="#FF9500" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M0 555 Q260 530 520 522 Q780 514 1039 502" stroke="#FFB340" stroke-width="2" stroke-dasharray="35 22" fill="none" opacity="0.3"/>

  <!-- Company name (tight to top) -->
  <text x="520" y="65" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-0.5">THIND <tspan fill="#FF9500">TRANSPORT</tspan></text>
  <rect x="350" y="78" width="340" height="2.5" rx="1.25" fill="url(#orangeAccent)"/>
  <text x="520" y="102" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="4">THE TRUCK ROLLS. THE OFFICE NEVER SLEEPS.</text>

  <!-- Ground plane connecting all zones -->
  <line x1="0" y1="430" x2="1039" y2="430" stroke="white" stroke-width="0.8" opacity="0.06"/>

  <!-- === LEFT ZONE: ORIGIN / OPERATIONS === -->

  <!-- Warehouse -->
  <g opacity="0.15" transform="translate(18, 250)">
    <rect x="0" y="38" width="148" height="100" rx="3" fill="white"/>
    <path d="M-7 38 L74 0 L155 38" fill="white"/>
    <rect x="14" y="86" width="48" height="52" rx="2.5" fill="white" opacity="0.35"/>
    <rect x="76" y="86" width="48" height="52" rx="2.5" fill="white" opacity="0.35"/>
  </g>

  <!-- Forklift with operator -->
  <g opacity="0.16" transform="translate(182, 320)">
    <rect x="0" y="21" width="38" height="28" rx="5" fill="white"/>
    <rect x="35" y="0" width="7" height="52" rx="1.5" fill="white"/>
    <rect x="30" y="3" width="17" height="7" rx="1.5" fill="white"/>
    <rect x="28" y="-10" width="21" height="17" rx="2.5" fill="white" opacity="0.5"/>
    <circle cx="10" cy="55" r="7" fill="white"/>
    <circle cx="29" cy="55" r="7" fill="white"/>
    <circle cx="16" cy="10" r="9" fill="white"/>
    <rect x="10" y="19" width="10" height="7" rx="3" fill="white"/>
  </g>

  <!-- Dispatcher at desk -->
  <g opacity="0.14" transform="translate(35, 185)">
    <rect x="0" y="38" width="59" height="7" rx="1.5" fill="white"/>
    <rect x="5" y="45" width="7" height="21" rx="1.5" fill="white"/>
    <rect x="47" y="45" width="7" height="21" rx="1.5" fill="white"/>
    <rect x="9" y="14" width="35" height="24" rx="3" fill="white"/>
    <rect x="23" y="38" width="7" height="5" rx="1" fill="white"/>
    <circle cx="73" cy="24" r="10" fill="white"/>
    <rect x="64" y="35" width="17" height="17" rx="5" fill="white"/>
    <line x1="64" y1="42" x2="49" y2="38" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Worker pushing hand truck -->
  <g opacity="0.14" transform="translate(260, 310)">
    <circle cx="14" cy="0" r="10" fill="white"/>
    <rect x="7" y="10" width="14" height="28" rx="5" fill="white"/>
    <line x1="10" y1="38" x2="3" y2="59" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="17" y1="38" x2="26" y2="59" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="21" y1="21" x2="38" y2="17" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <rect x="35" y="0" width="5" height="48" rx="1.5" fill="white"/>
    <rect x="31" y="48" width="17" height="5" rx="1.5" fill="white"/>
    <circle cx="35" cy="59" r="6" fill="white"/>
    <circle cx="47" cy="59" r="6" fill="white"/>
    <rect x="30" y="-7" width="17" height="14" rx="2.5" fill="white" opacity="0.5"/>
  </g>

  <!-- Mechanic crouching with wrench -->
  <g opacity="0.13" transform="translate(340, 390)">
    <circle cx="17" cy="0" r="9" fill="white"/>
    <path d="M10 9 Q7 24 24 31" stroke="white" stroke-width="7" stroke-linecap="round" fill="none"/>
    <line x1="28" y1="21" x2="49" y2="14" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <circle cx="52" cy="12" r="7" fill="none" stroke="white" stroke-width="4"/>
    <rect x="-3" y="24" width="24" height="14" rx="3" fill="white" opacity="0.5"/>
  </g>

  <!-- === TRUCK (centered) === -->
  <g transform="translate(250, 290)">
    <!-- Journey trail glow -->
    <path d="M-200 115 Q-100 112 0 110 Q80 108 140 107" stroke="url(#trailG)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M-140 115 Q-60 112 30 110 Q100 108 140 107" stroke="url(#trailLine)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Headlight beams -->
    <ellipse cx="500" cy="102" rx="65" ry="10" fill="url(#headlight)" filter="url(#softGlow)"/>

    <!-- Trailer shadow -->
    <ellipse cx="310" cy="135" rx="180" ry="8" fill="rgba(0,0,0,0.25)"/>

    <!-- Trailer undercarriage -->
    <rect x="142" y="100" width="192" height="8" rx="2" fill="#333"/>

    <!-- Trailer body -->
    <rect x="140" y="30" width="196" height="72" rx="4" fill="url(#truckGrad)"/>
    <rect x="140" y="30" width="196" height="72" rx="4" stroke="#CC7700" stroke-width="1" fill="none"/>

    <!-- Trailer panel lines -->
    <line x1="170" y1="33" x2="170" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>
    <line x1="200" y1="33" x2="200" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>
    <line x1="230" y1="33" x2="230" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>
    <line x1="260" y1="33" x2="260" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>
    <line x1="290" y1="33" x2="290" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>
    <line x1="320" y1="33" x2="320" y2="99" stroke="#CC7700" stroke-width="0.5" opacity="0.35"/>

    <!-- Top highlight -->
    <rect x="140" y="30" width="196" height="10" rx="4" fill="white" opacity="0.06"/>

    <!-- THIND TRANSPORT on trailer -->
    <text x="238" y="62" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#001F3F" text-anchor="middle" letter-spacing="0.5">THIND</text>
    <rect x="205" y="66" width="66" height="1.5" rx="0.75" fill="#001F3F" opacity="0.25"/>
    <text x="238" y="82" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#001F3F" text-anchor="middle" letter-spacing="4">TRANSPORT</text>

    <!-- Connection plate -->
    <rect x="334" y="46" width="10" height="40" rx="2" fill="#888"/>
    <rect x="337" y="52" width="4" height="28" rx="1" fill="#666"/>

    <!-- Cab -->
    <path d="M342 35 L380 35 Q410 35 425 52 L440 80 Q444 90 444 96 L444 104 Q444 107 441 107 L342 107 L342 35Z" fill="url(#cabG)"/>
    <path d="M342 35 L380 35 Q410 35 425 52 L440 80 Q444 90 444 96 L444 104 Q444 107 441 107 L342 107 L342 35Z" stroke="#CC7700" stroke-width="1" fill="none"/>

    <!-- Chrome strip -->
    <line x1="342" y1="102" x2="444" y2="102" stroke="#FFD080" stroke-width="1.2" opacity="0.35"/>

    <!-- Windshield -->
    <path d="M358 39 L392 39 Q414 39 426 55 L436 78 L436 88 Q436 90 434 90 L358 90 L358 39Z" fill="#0a1628" opacity="0.8"/>
    <path d="M358 39 L392 39 Q414 39 426 55 L436 78" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
    <path d="M363 43 L385 43 Q400 43 410 55 L416 66" stroke="rgba(255,255,255,0.06)" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Headlights -->
    <rect x="443" y="72" width="5" height="14" rx="2" fill="#FFEEBB" opacity="0.95" filter="url(#glow)"/>
    <rect x="443" y="92" width="5" height="7" rx="1.5" fill="#FF3333" opacity="0.8"/>

    <!-- Mirror -->
    <rect x="448" y="48" width="4" height="10" rx="1.5" fill="#555"/>
    <rect x="449" y="49" width="3" height="7" rx="1" fill="#888"/>

    <!-- Bumper -->
    <rect x="446" y="100" width="6" height="8" rx="1.5" fill="#888"/>

    <!-- Exhaust stacks -->
    <rect x="350" y="14" width="4.5" height="24" rx="2" fill="#777"/>
    <rect x="358" y="18" width="4.5" height="20" rx="2" fill="#777"/>
    <circle cx="352" cy="10" r="3" fill="white" opacity="0.03"/>
    <circle cx="354" cy="4" r="4" fill="white" opacity="0.02"/>
    <circle cx="360" cy="13" r="2.5" fill="white" opacity="0.03"/>

    <!-- Fuel tank -->
    <rect x="342" y="88" width="24" height="14" rx="4" fill="#555" stroke="#666" stroke-width="0.5"/>

    <!-- Trailer wheels (tandem rear) -->
    <circle cx="180" cy="112" r="13" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="180" cy="112" r="9" fill="#1a1a1a"/>
    <circle cx="180" cy="112" r="6" fill="#2a2a2a"/>
    <circle cx="180" cy="112" r="2.5" fill="#555"/>

    <circle cx="210" cy="112" r="13" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="210" cy="112" r="9" fill="#1a1a1a"/>
    <circle cx="210" cy="112" r="6" fill="#2a2a2a"/>
    <circle cx="210" cy="112" r="2.5" fill="#555"/>

    <!-- Front trailer wheels -->
    <circle cx="290" cy="112" r="13" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="290" cy="112" r="9" fill="#1a1a1a"/>
    <circle cx="290" cy="112" r="6" fill="#2a2a2a"/>
    <circle cx="290" cy="112" r="2.5" fill="#555"/>

    <circle cx="320" cy="112" r="13" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="320" cy="112" r="9" fill="#1a1a1a"/>
    <circle cx="320" cy="112" r="6" fill="#2a2a2a"/>
    <circle cx="320" cy="112" r="2.5" fill="#555"/>

    <!-- Cab drive wheels -->
    <circle cx="410" cy="112" r="14" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="410" cy="112" r="10" fill="#1a1a1a"/>
    <circle cx="410" cy="112" r="6.5" fill="#2a2a2a"/>
    <circle cx="410" cy="112" r="3" fill="#555"/>

    <!-- Mud flaps -->
    <rect x="216" y="112" width="5" height="10" rx="1" fill="#333"/>
    <rect x="326" y="112" width="5" height="10" rx="1" fill="#333"/>

    <!-- Forward journey dots -->
    <circle cx="470" cy="104" r="3.5" fill="#FF9500" opacity="0.3"/>
    <circle cx="500" cy="102" r="3" fill="#FF9500" opacity="0.18"/>
    <circle cx="525" cy="101" r="2" fill="#FF9500" opacity="0.1"/>
  </g>

  <!-- === RIGHT ZONE: DESTINATION / BUSINESS === -->

  <!-- City skyline -->
  <g opacity="0.07">
    <rect x="870" y="240" width="19" height="95" rx="1.5" fill="white"/>
    <rect x="894" y="210" width="24" height="125" rx="1.5" fill="white"/>
    <rect x="923" y="230" width="28" height="105" rx="1.5" fill="white"/>
    <rect x="956" y="250" width="19" height="85" rx="1.5" fill="white"/>
    <rect x="980" y="220" width="16" height="115" rx="1.5" fill="white"/>
    <rect x="1001" y="245" width="22" height="90" rx="1.5" fill="white"/>
    <rect x="897" y="218" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="907" y="218" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="897" y="232" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="907" y="232" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="897" y="246" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="907" y="246" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="897" y="260" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
    <rect x="907" y="260" width="6" height="4" rx="0.8" fill="white" opacity="0.3"/>
  </g>

  <!-- Broker handshake -->
  <g opacity="0.16" transform="translate(880, 340)">
    <circle cx="17" cy="3" r="10" fill="white"/>
    <rect x="9" y="14" width="17" height="31" rx="5" fill="white"/>
    <line x1="12" y1="45" x2="5" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="45" x2="31" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="24" x2="48" y2="29" stroke="white" stroke-width="5" stroke-linecap="round"/>

    <circle cx="76" cy="3" r="10" fill="white"/>
    <rect x="68" y="14" width="17" height="31" rx="5" fill="white"/>
    <line x1="71" y1="45" x2="62" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="81" y1="45" x2="90" y2="66" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="68" y1="24" x2="45" y2="29" stroke="white" stroke-width="5" stroke-linecap="round"/>

    <circle cx="47" cy="29" r="7" fill="white" opacity="0.45"/>
  </g>

  <!-- Operations coordinator with tablet -->
  <g opacity="0.13" transform="translate(975, 305)">
    <circle cx="14" cy="3" r="10" fill="white"/>
    <rect x="5" y="14" width="17" height="28" rx="5" fill="white"/>
    <line x1="9" y1="42" x2="2" y2="62" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="19" y1="42" x2="28" y2="62" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <rect x="26" y="17" width="14" height="21" rx="2.5" fill="white" opacity="0.55"/>
    <line x1="22" y1="26" x2="26" y2="21" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom orange services bar -->
  <rect x="0" y="656" width="1039" height="40" fill="#FF9500"/>
  <text x="120" y="681" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#001F3F" letter-spacing="1.5">FLATBED</text>
  <text x="215" y="681" font-family="'Inter', sans-serif" font-size="12" fill="#001F3F" opacity="0.4">&bull;</text>
  <text x="255" y="681" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#001F3F" letter-spacing="1.5">DRY VAN</text>
  <text x="360" y="681" font-family="'Inter', sans-serif" font-size="12" fill="#001F3F" opacity="0.4">&bull;</text>
  <text x="400" y="681" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#001F3F" letter-spacing="1.5">REEFER</text>
  <text x="495" y="681" font-family="'Inter', sans-serif" font-size="12" fill="#001F3F" opacity="0.4">&bull;</text>
  <text x="535" y="681" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#001F3F" letter-spacing="1.5">48 STATES</text>
  <text x="860" y="681" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#001F3F" opacity="0.6" letter-spacing="1.5">THINDTRANSPORT.COM</text>
</svg>
