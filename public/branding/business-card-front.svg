    <!-- Scan label -->
    <text x="70" y="156" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1.5">SCAN TO VISIT</text>
