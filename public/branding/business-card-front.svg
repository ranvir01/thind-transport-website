<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1039 696" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#001A35"/>
      <stop offset="100%" stop-color="#00101F"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FFB340"/>
    </linearGradient>
  </defs>

  <rect width="1039" height="696" fill="url(#bgGrad)"/>

  <!-- Orange top edge -->
  <rect x="0" y="0" width="1039" height="4" fill="url(#orangeBar)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.5" fill="white" opacity="0.03"/>
  </pattern>
  <rect width="1039" height="696" fill="url(#dots)"/>

  <!-- Ambient glow top right -->
  <ellipse cx="850" cy="100" rx="300" ry="250" fill="rgba(255,149,0,0.03)"/>

  <!-- THIND TRANSPORT text logo -->
  <text x="70" y="62" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="white" letter-spacing="0">THIND</text>
  <text x="145" y="62" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FF9500" letter-spacing="0">TRANSPORT</text>
  <rect x="70" y="68" width="80" height="2" rx="1" fill="#FF9500" opacity="0.8"/>

  <!-- Owner Name -->
  <text x="70" y="140" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="white" letter-spacing="-0.5">Sukhdev Thind</text>
  <text x="70" y="168" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FF9500" letter-spacing="3" opacity="0.8">OWNER</text>

  <!-- Stats row -->
