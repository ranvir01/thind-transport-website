    <path d="M8 7.5a1 1 0 011-1h2.764a.5.5 0 01.474.342l.749 2.247a.5.5 0 01-.251.605l-1.129.565a5.521 5.521 0 002.758 2.758l.565-1.129a.5.5 0 01.605-.251l2.247.749a.5.5 0 01.342.474V15a1 1 0 01-1 1h-.5A8.021 8.021 0 018 8v-.5z" fill="#FF9500" transform="translate(2,2)"/>
    <text x="34" y="18" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="white">(206) 765-6300</text>
  </g>
  
  <!-- Email icon + address -->
  <g transform="translate(70, 518)">
    <rect width="26" height="26" rx="6" fill="rgba(255,149,0,0.15)"/>
    <rect x="5" y="7" width="16" height="12" rx="1.5" stroke="#FF9500" stroke-width="1.5" fill="none"/>
    <path d="M5 8.5 L13 14 L21 8.5" stroke="#FF9500" stroke-width="1.5" fill="none"/>
    <text x="34" y="18" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="white">thindcarrier@gmail.com</text>
  </g>
  
  <!-- Website icon + URL -->
