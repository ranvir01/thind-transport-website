    <line x1="6" y1="13" x2="20" y2="13" stroke="#FF9500" stroke-width="1"/>
    <text x="34" y="18" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="white">thindtransport.com</text>
  </g>
  
  <!-- Location -->
  <g transform="translate(70, 594)">
    <rect width="26" height="26" rx="6" fill="rgba(255,149,0,0.15)"/>
    <path d="M13 6 C9.686 6 7 8.686 7 12 C7 16.5 13 22 13 22 C13 22 19 16.5 19 12 C19 8.686 16.314 6 13 6Z" stroke="#FF9500" stroke-width="1.5" fill="none"/>
    <circle cx="13" cy="12" r="2" fill="#FF9500"/>
    <text x="34" y="18" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="white">Kent, WA 98064</text>
  </g>

