<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1039 696" fill="none">
  <!-- 
    MOO Business Card Front - Thind Transport
    Bleed: 3.46" x 2.32" @ 300dpi = 1038 x 696
    Trim: 3.30" x 2.16" @ 300dpi = 990 x 648  
    Safe: 3.14" x 2.02" @ 300dpi = 942 x 606
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#00152B"/>
      <stop offset="100%" stop-color="#001020"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FFB340"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1039" height="696" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1039" height="696" fill="url(#bgGrad)" clip-path="url(#cardClip)"/>
  
  <!-- Subtle road/highway pattern in background -->
  <path d="M-50 696 L350 0" stroke="rgba(255,255,255,0.03)" stroke-width="120" fill="none"/>
  <path d="M150 696 L550 0" stroke="rgba(255,255,255,0.02)" stroke-width="80" fill="none"/>
  
  <!-- Highway dashes (subtle) -->
  <line x1="100" y1="696" x2="400" y2="0" stroke="rgba(255,149,0,0.08)" stroke-width="3" stroke-dasharray="20,15"/>
  
  <!-- Geometric accent - top right corner -->
  <path d="M839 0 L1039 0 L1039 200" stroke="#FF9500" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M889 0 L1039 0 L1039 150" stroke="#FF9500" stroke-width="1.5" fill="none" opacity="0.2"/>
  
  <!-- Bottom left accent -->
  <path d="M0 496 L0 696 L200 696" stroke="#FF9500" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M0 546 L0 696 L150 696" stroke="#FF9500" stroke-width="1.5" fill="none" opacity="0.2"/>

  <!-- Orange accent bar at top -->
  <rect x="70" y="48" width="60" height="4" rx="2" fill="url(#orangeAccent)"/>

  <!-- Owner Name -->
  <text x="70" y="96" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-0.5">Sukhdev Thind</text>
  
  <!-- Title -->
  <text x="70" y="128" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#FF9500" letter-spacing="3">OWNER &amp; OPERATOR</text>

  <!-- Divider line -->
  <line x1="70" y1="155" x2="400" y2="155" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Services section -->
  <text x="70" y="195" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">SERVICES</text>
  
  <!-- Service items with orange bullets -->
  <circle cx="78" cy="222" r="3" fill="#FF9500"/>
  <text x="90" y="226" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Flatbed Freight</text>
  
  <circle cx="78" cy="248" r="3" fill="#FF9500"/>
  <text x="90" y="252" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Reefer / Temperature-Controlled</text>
  
  <circle cx="78" cy="274" r="3" fill="#FF9500"/>
  <text x="90" y="278" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Dry Van Shipping</text>

  <circle cx="78" cy="300" r="3" fill="#FF9500"/>
  <text x="90" y="304" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Owner Operator Leasing (91% Commission)</text>

