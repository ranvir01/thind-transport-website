  <text x="70" y="345" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">OPPORTUNITIES</text>
  
  <circle cx="78" cy="370" r="3" fill="#FF9500"/>
  <text x="90" y="374" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Company Drivers Wanted  Earn $78K-$110K/yr</text>
  
  <circle cx="78" cy="396" r="3" fill="#FF9500"/>
  <text x="90" y="400" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">Owner Operators  $150K-$250K/yr Gross</text>

  <circle cx="78" cy="422" r="3" fill="#FF9500"/>
  <text x="90" y="426" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">48 States Coverage | Local, Regional &amp; OTR</text>

