      <rect x="42" y="42" width="8" height="8" fill="#001F3F"/>
      <rect x="54" y="42" width="8" height="8" fill="#FF9500"/>
      <rect x="66" y="42" width="8" height="8" fill="#FF9500"/>
      <rect x="84" y="42" width="8" height="8" fill="#001F3F"/>
      <rect x="96" y="42" width="8" height="8" fill="#FF9500"/>
      
      <rect x="0" y="54" width="8" height="8" fill="#001F3F"/>
