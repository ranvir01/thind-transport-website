  <!-- DOT / MC numbers bottom right -->
  <text x="969" y="660" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.3)" text-anchor="end">USDOT #3154006 | FMCSA CERTIFIED</text>
