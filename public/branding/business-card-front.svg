    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2">COMMISSION</text>

    <text x="120" y="0" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FF9500">48</text>
    <text x="120" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2">STATES</text>

    <text x="220" y="0" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FF9500">2016</text>
    <text x="220" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2">SINCE</text>
