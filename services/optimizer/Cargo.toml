[package]
name = "hauldesk-optimizer"
version = "0.1.0"
edition = "2021"
description = "Route/ETA optimization and IFTA mileage calc for HaulDesk"

[dependencies]
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hauldesk-optimizer"
path = "src/main.rs"
