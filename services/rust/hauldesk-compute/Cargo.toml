[package]
name = "hauldesk-compute"
version = "0.1.0"
edition = "2021"
description = "CPU-heavy HaulDesk compute — IFTA, routing math, bulk CSV (V1 sidecar)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[[bin]]
name = "hauldesk-compute"
path = "src/main.rs"
