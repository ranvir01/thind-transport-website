syntax = "proto3";

package hauldesk.v1;

option go_package = "github.com/thind-transport/hauldesk/proto/hauldesk/v1;hauldeskv1";

// Contract-first API — generate TS (connect/grpc-web), Go (grpc), Rust (tonic/prost).
// See docs/design/HANDOFF.md §6 and services/*/README.md.

message Load {
  string ref = 1;
  string status = 2;
  string customer = 3;
  string origin = 4;
  string dest = 5;
  string driver = 6;
  int64 rate_cents = 7;
  int32 margin_pct = 8;
}

message ListLoadsRequest {
  string carrier_id = 1;
}

message ListLoadsResponse {
  repeated Load loads = 1;
}

message AssignDriverRequest {
  string ref = 1;
  string driver_id = 2;
}

message AdvanceLoadRequest {
  string ref = 1;
}

service LoadsService {
  rpc ListLoads(ListLoadsRequest) returns (ListLoadsResponse);
  rpc AssignDriver(AssignDriverRequest) returns (Load);
  rpc AdvanceLoad(AdvanceLoadRequest) returns (Load);
}

message RouteEstimateRequest {
  string load_ref = 1;
}

message RouteEstimateResponse {
  int32 eta_minutes = 1;
  double distance_miles = 2;
}

service OptimizerService {
  rpc EstimateEta(RouteEstimateRequest) returns (RouteEstimateResponse);
}

message IftaCalcRequest {
  string carrier_id = 1;
  string quarter = 2;
}

message IftaCalcResponse {
  repeated string jurisdiction_ids = 1;
}

service IftaService {
  rpc CalcIfta(IftaCalcRequest) returns (IftaCalcResponse);
}
